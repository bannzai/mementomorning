name: MementoMorning
options:
  bundleIdPrefix: com.bannzai
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: TQPN82UBBY
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
packages:
  # 課金 (issue #9)。purchases-ios ではなくバイナリ配布の purchases-ios-spm を使う (ビルド時間短縮。nikki と同じ選定)
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.83.1
targets:
  MementoMorning:
    type: application
    platform: iOS
    sources:
      # feature ごとの QA.md (setup-qa) はドキュメントでありアプリのリソースではない。
      # 除外しないと全 feature の QA.md が同じ QA.md という名前でバンドル直下へコピーされ、
      # multiple commands produce でビルドが失敗する
      - path: MementoMorning
        excludes:
          - "**/QA.md"
    dependencies:
      - package: RevenueCat
    # RevenueCat の API key は public リポジトリにコミットしないため、既定値だけを持つ
    # Config.xcconfig 経由で渡す (実値は gitignore した Config.local.xcconfig で上書きする。issue #15)
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    # Release でキーが空のままだと課金が動かないアーカイブを配布してしまうため、ビルド時に検出して失敗させる。
    # Debug はキー無しでも動く (configure スキップ + 見本価格) 仕様のため対象外 (PR #30 レビュー指摘)
    preBuildScripts:
      - name: Require REVENUECAT_API_KEY for Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ -z "${REVENUECAT_API_KEY}" ]; then
            echo "error: REVENUECAT_API_KEY が空です。Config.local.xcconfig を用意してください (手順は Config.xcconfig のコメント参照)"
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.MementoMorning
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MementoMorning/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 縦向き固定。デザインは縦持ち前提 (design_handoff_memento_morning) で、
        # 動画回答の録画・プレビューの回転角 90° 固定 (VideoAnswerCamera) もこの設定を前提にする。
        # iPad の縦向き固定に従来必要だった UIRequiresFullScreen は iOS 26 で deprecated
        # (ビルド warning になり、将来無視される) のため宣言しない
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: MementoMorning/MementoMorning.entitlements
        STRING_CATALOG_GENERATE_SYMBOLS: YES
      configs:
        Release:
          # 疑似録画モード (issue #52) のフィクスチャ動画は DEBUG 限定の検証用リソースのため、
          # リリースビルドの成果物に含めない (コード側は #if DEBUG で除外している)
          EXCLUDED_SOURCE_FILE_NAMES: DebugVideoAnswerFixture_*.mov
  MementoMorningTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MementoMorningTests
      # SKTestSession(configurationFileNamed:) がテストバンドルから .storekit を読むため、
      # scheme の run 用と同じファイルをリソースとして同梱する (StoreKitConfigurationTests)
      - path: MementoMorning.storekit
        buildPhase: resources
    dependencies:
      - target: MementoMorning
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.MementoMorningTests
        GENERATE_INFOPLIST_FILE: YES
  # App Store スクリーンショット撮影専用のホストアプリ (issue #13)。
  # 本番アプリとは独立させ、スクショ用のモック画面だけをリリース物に含めず保持する
  AppStoreScreenshots:
    type: application
    platform: iOS
    sources:
      # 本番ソースは含めず自己完結させる (取り込み元 bannzai/Focus と同じ構成)。
      # 同一ファイルを 2 ターゲットの sources に載せると xcodebuild が multiple groups の
      # malformed project 警告を出すため、デザイントークンは Sources/DesignTokens.swift に複製する
      - AppStoreScreenshots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.MementoMorning.AppStoreScreenshots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 起動画面の生成キーが無いと互換モード (レターボックス) で描画され、
        # スクリーンショットがストア要求の px サイズにならない
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  # App Store スクリーンショットを XCTAttachment で撮影する UITest (appstore-screenshot-builder skill の SnapshotUITest 方式)
  AppStoreScreenshotsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppStoreScreenshotsUITests
    dependencies:
      - target: AppStoreScreenshots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.MementoMorning.AppStoreScreenshotsUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AppStoreScreenshots
  # 本番画面の多言語スクリーンショットを撮影する UITest (detect-mistranslation skill の snapshot_ui_tests 基盤)
  MementoMorningSnapshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MementoMorningSnapshotUITests
    dependencies:
      - target: MementoMorning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bannzai.MementoMorningSnapshotUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MementoMorning
schemes:
  MementoMorning:
    build:
      targets:
        MementoMorning: all
    run:
      config: Debug
      # 課金の動作確認を Sandbox Apple ID なしでローカル完結させる (issue #15)。
      # RevenueCat は StoreKit Configuration file でのテストに対応しており、商品は
      # RevenueCat 側に登録済みであればよい (返金・キャンセルのイベントだけは記録されない)
      storeKitConfiguration: MementoMorning.storekit
    test:
      config: Debug
      targets:
        - MementoMorningTests
  AppStoreScreenshotsUITests:
    build:
      targets:
        AppStoreScreenshots: all
        AppStoreScreenshotsUITests: all
    test:
      config: Debug
      targets:
        - AppStoreScreenshotsUITests
  MementoMorningSnapshotUITests:
    build:
      targets:
        MementoMorning: all
        MementoMorningSnapshotUITests: all
    test:
      config: Debug
      targets:
        - MementoMorningSnapshotUITests
