# 「点」画面のシーン (デモ動画 issue #94、issue #122 で人生カレンダーから置き換え)。答えた朝が点として積もる表現で締める
appId: com.bannzai.MementoMorning
---
- launchApp:
    stopApp: true
- tapOn: "Dots"
- extendedWaitUntil:
    visible: "One dot, one answered morning."
    timeout: 10000
# 物理で粒が落ちて積もりきるまで映し続ける
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 6000
    optional: true
    label: "粒が積もる様子を 6 秒見せる"
# ja: 点はいつかつながる
- extendedWaitUntil:
    visible: "The dots will connect."
    timeout: 10000
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 4000
    optional: true
    label: "締めの一文を 4 秒見せる"
