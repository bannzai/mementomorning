# 人生カレンダーのシーン (デモ動画 issue #94)。答えた朝が点として埋まる表現で締める
appId: com.bannzai.MementoMorning
---
- launchApp:
    stopApp: true
- tapOn: "Life Calendar"
- extendedWaitUntil:
    visible: "Each row is a week. Answered mornings remain as dots."
    timeout: 10000
# 点の埋まったグリッドを見せる
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 4000
    optional: true
    label: "人生カレンダーを 4 秒見せる"
- scrollUntilVisible:
    element:
      text: "The dots will connect."
    direction: DOWN
    speed: 15
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 4000
    optional: true
    label: "締めの一文を 4 秒見せる"
