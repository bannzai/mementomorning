# 朝の問い → 録画 → 停止 = 回答完了のシーン (デモ動画 issue #94)。
# 前提: prep/morning-question.yaml で疑似録画モード ON・今日未回答・アラーム発火記録済みにしてある
# (再起動すると朝の問いが全画面で出る)。写真ライブラリ・音声認識の許可も prep で済ませてあるためダイアログは出ない
appId: com.bannzai.MementoMorning
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "morning_question_record_button"
    timeout: 20000
# 問い「If today were your last day, what would you want to do?」を見せる
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 4000
    optional: true
    label: "問いを 4 秒見せる"
- tapOn:
    id: "morning_question_record_button"
# 録画はアプリの上限 videoAnswerMaxRecordingDuration = 10 秒の自動停止に任せ、停止タップはしない。
# 停止タップ方式は extendedWaitUntil の実時間 overhead 次第で「自動停止後 (ボタン消滅で
# Element not found)」にも「録画途中 (尺が不定になる)」にもなり得た実測があり、
# 自動停止待ちなら毎回 10 秒録画で決定的になる (2026-08-26 の収録実測。停止の画は
# 自動停止と見分けがつかないため演出上の差もない)
# 保存 → 画面が閉じてホームの「今朝のことば」に反映されるまで待つ
- extendedWaitUntil:
    visible: "This morning's words"
    timeout: 30000
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 3000
    optional: true
    label: "回答が反映されたホームを 3 秒見せる"
