# 朝の問い → 録画 → 停止 = 回答完了のシーン (デモ動画 issue #94)。
# 前提: prep/morning-question.yaml で疑似録画モード ON・今日未回答・アラーム発火記録済みにしてある
# (再起動すると朝の問いが全画面で出る)。写真ライブラリ・音声認識の許可も prep で済ませてあるためダイアログは出ない
appId: com.bannzai.MementoMorning
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "morning_question_record_button"
    timeout: 20000
# 問い「If today were your last day, what would you want to do?」を見せる
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 4000
    optional: true
    label: "問いを 4 秒見せる"
- tapOn:
    id: "morning_question_record_button"
# 録画中 (タイマーと外リングの進捗) を見せる。
# アプリは videoAnswerMaxRecordingDuration = 10 秒で自動停止して停止ボタンが消えるため、
# Maestro の実時間 overhead (実測 2.7〜4 秒) を足しても 10 秒に届かない 3 秒に抑える
# (6000 だと実時間が 10 秒を超え、次の停止タップが Element not found で失敗した実測あり)
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 3000
    optional: true
    label: "録画中を 3 秒見せる"
- tapOn:
    id: "morning_question_record_button"
# 停止 = 回答完了。保存 → 画面が閉じてホームの「今朝のことば」に反映される
- extendedWaitUntil:
    visible: "This morning's words"
    timeout: 30000
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 3000
    optional: true
    label: "回答が反映されたホームを 3 秒見せる"
