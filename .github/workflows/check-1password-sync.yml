# onepassword-sync skill の雛形: .env.1password.github-actions に宣言した NAME が、すべて GitHub Actions の secret にあるかを検査する。
# 各リポジトリの .github/workflows/check-1password-sync.yml に置く。値も更新時刻も見ない (名前の集合だけを比べる)。
# 更新時刻での同期漏れ (ローテーション後に同期していない) は、手元の sync-from-1password.sh --check が検出する。
#
# GITHUB_TOKEN の権限:
#   GITHUB_TOKEN の permissions: に secrets の項目は無く、secret の一覧 (GET /repos/{owner}/{repo}/actions/secrets) を読む権限を
#   付与できない (https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#permissions 、2026-10-26 に確認)。
#   2026-10-26 にこの雛形を bannzai/castle で実行し、GITHUB_TOKEN の gh secret list が HTTP 403 で失敗することを確かめた
#   (https://github.com/bannzai/castle/actions/runs/40269398164 )。そのため 403 の時は warning を出して成功で終え、検査は手元の --check に任せる
#   (常に fail させると、雛形を置いた全リポジトリで CI が赤のままになる)
name: check-1password-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 参照ファイルの NAME と GitHub Actions の secret の名前を比べる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=.env.1password.github-actions
          if [ ! -f "$file" ]; then
            echo "::notice::${file} が無いため検査しない"
            exit 0
          fi
          # GitHub は secret 名を大文字で保存するため、大文字に揃えて比べる
          declared=$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$file" | cut -d= -f1 | tr '[:lower:]' '[:upper:]' | sort -u)
          if ! secrets=$(gh secret list -R "$GITHUB_REPOSITORY" --json name --jq '.[].name' 2>"$RUNNER_TEMP/gh.err"); then
            if grep -q 'HTTP 403' "$RUNNER_TEMP/gh.err"; then
              echo "::warning::GITHUB_TOKEN では secret の一覧を読めない (HTTP 403)。手元で sync-from-1password.sh --check を実行して確かめる"
              exit 0
            fi
            cat "$RUNNER_TEMP/gh.err" >&2
            exit 1
          fi
          missing=$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$secrets" | tr '[:lower:]' '[:upper:]' | sort -u))
          if [ -n "$missing" ]; then
            echo "::error::${file} にあって GitHub Actions の secret に無い名前: $(printf '%s' "$missing" | tr '\n' ' ')。sync-from-1password.sh で同期する"
            exit 1
          fi
          echo "${file} の NAME はすべて secret にある"
