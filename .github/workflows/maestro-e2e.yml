# GitHub Actions の macOS Runner 上で Maestro E2E flow をバッチ実行する workflow。
# maestro-e2e-actions skill (~/.claude/skills/maestro-e2e-actions/SKILL.md) が生成する。
# 起動例:
#   gh workflow run maestro-e2e.yml -f flows=all -f device="iPhone 17"
name: maestro-e2e
run-name: "maestro-e2e flows=${{ inputs.flows }} device=${{ inputs.device }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    inputs:
      flows:
        description: "実行する flow。all (.maestro/flows 配下すべて) または .maestro/ 配下のコミット済みパス"
        required: true
        default: all
      device:
        description: "Simulator のデバイス名"
        required: true
        default: "iPhone 17"
      record_video:
        description: "実行中の画面を録画して artifact に含める"
        required: false
        default: "true"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # アプリ固有のビルド前準備 (secret 復元・xcconfig 生成等) が要る場合はこの下に step を足す
      # CODE_SIGNING_ALLOWED=NO では entitlement が付かず、App Groups 等を使うアプリは起動時にクラッシュする。
      # Simulator では team なしの ad-hoc 署名 (CODE_SIGN_IDENTITY=-) で entitlement を付けられる。
      - name: Simulator 用にビルドする
        run: |
          xcodebuild build \
            -project 'MementoMorning.xcodeproj' \
            -scheme 'MementoMorning' \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES
      # upload-artifact はファイル権限を保持しない (download 後は全て 0644 になり .app の実行バイナリが壊れる) ため、
      # tar で権限ごと固めてから artifact にする。e2e 側の maestro-e2e-run.sh が展開する。
      - name: ビルド成果物を tar でまとめる
        run: tar -C build/DerivedData/Build/Products/Debug-iphonesimulator -cf simulator-app.tar .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-app
          path: simulator-app.tar
          retention-days: 1
  e2e:
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulator-app
          path: build-app
      - name: Maestro flow を実行
        env:
          FLOWS: ${{ inputs.flows }}
          DEVICE: ${{ inputs.device }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: bash .github/scripts/maestro-e2e-run.sh
      # public repo の artifact は誰でもダウンロードできるため保持期間を短くする。
      # 録画にシード済みダミーデータ以外を映さない運用は QA.md 側に記載する。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-e2e-artifacts
          path: maestro-artifacts
          retention-days: 3
