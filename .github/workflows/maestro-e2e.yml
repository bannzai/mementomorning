# GitHub Actions の macOS Runner 上で Maestro E2E flow をバッチ実行する workflow。
# maestro-e2e-actions skill (~/.claude/skills/maestro-e2e-actions/SKILL.md) が生成する。
# 起動例:
#   gh workflow run maestro-e2e.yml -f flows=all -f device="iPhone 17"
name: maestro-e2e
run-name: "maestro-e2e flows=${{ inputs.flows }} device=${{ inputs.device }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    inputs:
      flows:
        description: "実行する flow。all (.maestro/flows 配下すべて) または .maestro/ 配下のコミット済みパス"
        required: true
        default: all
      device:
        description: "Simulator のデバイス名"
        required: true
        default: "iPhone 17"
      record_video:
        description: "実行中の画面を録画して artifact に含める"
        required: false
        default: "true"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # アプリ固有のビルド前準備 (secret 復元・xcconfig 生成等) が要る場合はこの下に step を足す
      # CODE_SIGNING_ALLOWED=NO では entitlement が付かず、App Groups 等を使うアプリは起動時にクラッシュする。
      # Simulator では team なしの ad-hoc 署名 (CODE_SIGN_IDENTITY=-) で entitlement を付けられる。
      - name: Simulator 用にビルドする
        run: |
          xcodebuild build \
            -project 'MementoMorning.xcodeproj' \
            -scheme 'MementoMorning' \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator # .app の親ディレクトリ (.app 直指定は中身が flatten される)
          retention-days: 1
  e2e:
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # checkout のみ
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: simulator-app
          path: build-app
      - name: Maestro flow を実行
        env:
          FLOWS: ${{ inputs.flows }}
          DEVICE: ${{ inputs.device }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: bash .github/scripts/maestro-e2e-run.sh
      # public repo の artifact は誰でもダウンロードできるため保持期間を短くする。
      # 録画にシード済みダミーデータ以外を映さない運用は QA.md 側に記載する。
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: maestro-e2e-artifacts
          path: maestro-artifacts
          retention-days: 3
